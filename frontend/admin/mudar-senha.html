<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo">M&J Admin</div>

        <main class="admin-content">
            <div class="admin-header">
                <h1>Mudar Senha do Administrador</h1>
            </div>

            <div class="card" style="max-width: 500px;">
                <form id="password-form">
                    <div class="form-group">
                        <label for="new-password">Nova Palavra-passe</label>
                        <input type="password" id="new-password" class="form-control" required minlength="6" placeholder="Nova palavra-passe">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirmar Palavra-passe</label>
                        <input type="password" id="confirm-password" class="form-control" required minlength="6" placeholder="Confirme a nova palavra-passe">
                    </div>
                    <button type="submit" class="btn btn-primary">Atualizar Senha</button>
                </form>
            </div>
        </main>
    </div><script>
        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (newPassword !== confirmPassword) {
                alert("As palavras-passe não coincidem!");
                return;
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = "A atualizar...";
            btn.disabled = true;

            const success = await changePassword(newPassword);
            
            if (success) {
                e.target.reset();
            }

            btn.textContent = originalText;
            btn.disabled = false;
        });
    </script>
