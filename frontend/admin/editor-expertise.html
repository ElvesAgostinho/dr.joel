<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Área de Prática - Mário &amp; Joel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/auth.js?v=18"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo">M&amp;J Admin</div>
            <nav class="admin-nav">
                <a href="index.html">Publicações</a>
                <a href="equipa.html">Equipa</a>
                <a href="artes.html">Arte</a>
                <a href="gestao-expertise.html" class="active">Áreas de Prática</a>
                <a href="gestao-sobrenos.html">Sobre Nós</a>
                <a href="../index.html">Ver Site</a>
            
                <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                    <a href="mudar-senha.html">Mudar Senha</a>
                    <a href="#" id="btn-logout">Terminar Sessão</a>
                </div>
            </nav>
        </aside>
        
        <main class="admin-content">
            <div class="admin-header">
                <h1 id="editor-title">Nova Área de Prática</h1>
                <a href="gestao-expertise.html" class="btn btn-secondary">Cancelar</a>
            </div>

            <div class="card">
                <form id="exp-form" onsubmit="event.preventDefault();">
                    <input type="hidden" id="exp-id">
                    
                    <div class="form-group">
                        <label for="exp-title">Título da Área de Prática</label>
                        <input type="text" id="exp-title" class="form-control" required placeholder="Ex: Direito Fiscal">
                    </div>

                    <div class="form-group">
                        <label>Descrição / Texto Principal</label>
                        <div id="quill-editor" style="height: 300px; background: white;"></div>
                        <input type="hidden" id="exp-desc">
                    </div>

                    <button type="button" id="btn-save-exp" class="btn btn-primary" style="margin-top: 20px;">Gravar Área de Prática</button>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="js/api.js?v=18"></script>
    <script>
        // FIX: Inicializar Quill imediatamente (script no fim do body, DOM já está pronto)
        var quill = new Quill('#quill-editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link', 'clean']
                ]
            }
        });

        // Carregar dados se estiver em modo de edição
        var urlParams = new URLSearchParams(window.location.search);
        var expId = urlParams.get('id');

        if (expId) {
            document.getElementById('editor-title').textContent = 'Editar Área de Prática';
            var exp = await API.getExpertiseItem(expId);
            if (exp) {
                document.getElementById('exp-id').value = exp.id;
                document.getElementById('exp-title').value = exp.title;
                document.getElementById('exp-desc').value = exp.description || '';
                // FIX: quill já existe aqui — carregar conteúdo existente
                quill.root.innerHTML = exp.description || '';
            
                    }
                }, { once: true });
            }
        }

        document.getElementById('btn-save-exp').addEventListener('click', function() {
            var title = document.getElementById('exp-title').value.trim();

            // FIX: Sincronizar Quill para hidden input ANTES de ler
            var description = quill.root.innerHTML;
            document.getElementById('exp-desc').value = description;

            // Verificar se o conteúdo do Quill é apenas vazio (<p><br></p>)
            var isEmptyContent = quill.getText().trim() === '';

            if (!title) {
                alert('Por favor, preencha o título!');
                return;
            }

            if (isEmptyContent) {
                alert('Por favor, preencha a descrição!');
                return;
            }

            var btn = document.getElementById('btn-save-exp');
            btn.textContent = 'A guardar...';
            btn.disabled = true;

            var expData = {
                id: document.getElementById('exp-id').value || null,
                title: title,
                description: description
            };

            API.saveExpertiseItem(expData).then(function() {
                alert('Área de Prática guardada com sucesso!');
                window.location.href = 'gestao-expertise.html';
            }).catch(function(err) {
                alert('Erro ao guardar Área de Prática: ' + err.message);
                btn.textContent = 'Gravar Área de Prática';
                btn.disabled = false;
            });
        });
    </script>
</body>

</html>
