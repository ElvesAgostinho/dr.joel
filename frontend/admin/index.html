<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <link rel="preconnect" href="https://ulymellasjmsejgeutyt.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://ulymellasjmsejgeutyt.supabase.co">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mário & Joel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/auth.js?v=99"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo">M&J Admin</div>
            <nav class="admin-nav">
                <a href="index.html" class="active">Publicações</a>
                <a href="equipa.html">Equipa</a>
                <a href="artes.html">Arte</a>
                <a href="gestao-expertise.html">Áreas de Prática</a>
                <a href="gestao-sobrenos.html">Sobre Nós</a>
                <a href="gestao-servicos.html">Opções do Formulário</a>
                <a href="../index.html">Ver Site</a>
            
                <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                    <a href="mudar-senha.html">Mudar Senha</a>
                    <a href="#" id="btn-logout">Terminar Sessão</a>
                </div>
            </nav>
        </aside>
        
        <main class="admin-content">
            <div class="admin-header">
                <h1>Publicações (Insights & Media)</h1>
                <a href="editor.html" class="btn btn-primary">+ Nova Publicação</a>
            </div>

            <div class="card" style="margin-bottom: 40px;">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Data</th>
                            <th>Estado</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="posts-tbody">
                        <!-- Posts dynamically loaded here -->
                    </tbody>
                </table>
            </div>

            <div class="admin-header">
                <h2>Configurações da Equipa (Página Inicial)</h2>
            </div>
            <div class="card">
                <form id="stats-form" onsubmit="event.preventDefault();">
                    <div style="display: flex; gap: 20px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="stat-input-pessoas">PESSOAS</label>
                            <input type="number" id="stat-input-pessoas" class="form-control" required>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="stat-input-advogados">ADVOGADOS</label>
                            <input type="number" id="stat-input-advogados" class="form-control" required>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="stat-input-jurisdicoes">JURISDIÇÕES</label>
                            <input type="number" id="stat-input-jurisdicoes" class="form-control" required>
                        </div>
                    </div>
                    <button id="btn-save-stats" class="btn btn-primary">Gravar Estatísticas</button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/api.js?v=99"></script>
    <script src="js/dashboard.js?v=99"></script></body>
</html>
