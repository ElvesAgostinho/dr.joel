<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Sobre Nós - Mário &amp; Joel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/auth.js?v=22"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo">M&amp;J Admin</div>
            <nav class="admin-nav">
                <a href="index.html">Publicações</a>
                <a href="equipa.html">Equipa</a>
                <a href="artes.html">Arte</a>
                <a href="gestao-expertise.html">Áreas de Prática</a>
                <a href="gestao-sobrenos.html" class="active">Sobre Nós</a>
                <a href="../index.html">Ver Site</a>
            
                <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                    <a href="mudar-senha.html">Mudar Senha</a>
                    <a href="#" id="btn-logout">Terminar Sessão</a>
                </div>
            </nav>
        </aside>
        
        <main class="admin-content">
            <div class="admin-header">
                <h1 id="editor-title">Editar Página Institucional</h1>
                <a href="gestao-sobrenos.html" class="btn btn-secondary">Cancelar</a>
            </div>

            <div class="card">
                <form id="sobrenos-form" onsubmit="event.preventDefault();">
                    <input type="hidden" id="sobrenos-id">
                    
                    <div class="form-group">
                        <label for="sobrenos-title">Título da Página</label>
                        <input type="text" id="sobrenos-title" class="form-control" required placeholder="Ex: A Firma">
                    </div>

                    <div class="form-group">
                        <label>Conteúdo (Suporta formatação rica)</label>
                        <div id="quill-editor" style="height: 350px; background: white;"></div>
                        <input type="hidden" id="sobrenos-content">
                    </div>

                    <button type="button" id="btn-save-sobrenos" class="btn btn-primary" style="margin-top: 20px;">Gravar Alterações</button>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="js/api.js?v=22"></script>
    <script>
        // FIX: Inicializar Quill imediatamente (não dentro de DOMContentLoaded)
        // O script é diferido até o DOM estar pronto porque está no fim do body
        var quill = new Quill('#quill-editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link', 'clean']
                ]
            }
        });

        // Carregar dados da página
        var urlParams = new URLSearchParams(window.location.search);
        var pageId = urlParams.get('id');

        async function initPage() {
            if (!pageId) {
                alert("Nenhuma página selecionada.");
                window.location.href = 'gestao-sobrenos.html';
                return;
            }
            try {
                var page = await API.getSobreNosPage(pageId);
                if (page) {
                    document.getElementById('sobrenos-id').value = page.id;
                    document.getElementById('sobrenos-title').value = page.title;
                    document.getElementById('sobrenos-content').value = page.content || '';
                    quill.root.innerHTML = page.content || '';
                } else {
                    alert("Página não encontrada!");
                    window.location.href = 'gestao-sobrenos.html';
                }
            } catch (err) {
                alert("Erro ao carregar página: " + err.message);
            }
        }
        initPage();

        document.getElementById('btn-save-sobrenos').addEventListener('click', function() {
            // FIX: Sincronizar o Quill para o hidden input antes de ler
            var htmlContent = quill.root.innerHTML;
            document.getElementById('sobrenos-content').value = htmlContent;

            var title = document.getElementById('sobrenos-title').value.trim();
            var content = document.getElementById('sobrenos-content').value;

            if (!title) {
                alert('Por favor, preencha o título!');
                return;
            }

            var btn = document.getElementById('btn-save-sobrenos');
            btn.textContent = 'A guardar...';
            btn.disabled = true;

            var pageData = {
                id: document.getElementById('sobrenos-id').value,
                title: title,
                content: content
            };

            API.saveSobreNosPage(pageData).then(function() {
                alert('Página guardada com sucesso!');
                window.location.href = 'gestao-sobrenos.html';
            }).catch(function(err) {
                alert('Erro ao guardar página: ' + err.message);
                btn.textContent = 'Gravar Alterações';
                btn.disabled = false;
            });
        });
    </script>
</body>

</html>
