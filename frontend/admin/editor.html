<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Publicação - Admin M&J</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/auth.js?v=24"></script>
    <style>
        .cover-preview {
            margin-top: 10px;
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            display: none;
            object-fit: cover;
        }
        .cover-preview.visible { display: block; }
        .publish-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .publish-toggle label {
            margin: 0;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }
        .switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #ccc;
            border-radius: 26px;
            transition: 0.3s;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        .switch input:checked + .slider { background-color: #28a745; }
        .switch input:checked + .slider:before { transform: translateX(24px); }
        .status-text { font-size: 0.9rem; color: #666; }
        .status-text.published { color: #28a745; font-weight: 600; }
        #editor-container { height: 400px; background: white; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo">M&J Admin</div>
            <nav class="admin-nav">
                <a href="index.html" class="active">Publicações</a>
                <a href="equipa.html">Equipa</a>
                <a href="artes.html">Arte</a>
                <a href="gestao-expertise.html">Áreas de Prática</a>
                <a href="gestao-sobrenos.html">Sobre Nós</a>
                <a href="../index.html">Ver Site</a>
            
                <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                    <a href="mudar-senha.html">Mudar Senha</a>
                    <a href="#" id="btn-logout">Terminar Sessão</a>
                </div>
            </nav>
        </aside>

        <main class="admin-content">
            <header class="admin-header">
                <div>
                    <h1 id="page-title">Nova Publicação</h1>
                    <p>Crie ou edite publicações para o site.</p>
                </div>
                <a href="index.html" class="btn btn-secondary">Cancelar</a>
            </header>

            <div class="card" style="margin-top: 30px;">
                <form id="post-form" onsubmit="event.preventDefault();">
                    
                    <div class="form-group">
                        <label for="post-title">Título *</label>
                        <input type="text" id="post-title" required class="form-control" placeholder="Ex: Nova Parceria Internacional com Escritório em Lisboa">
                    </div>

                    <div class="form-group">
                        <label for="post-category">Categoria *</label>
                        <select id="post-category" class="form-control" required>
                            <option value="NOTÍCIAS & IMPRENSA">Notícias & Imprensa</option>
                            <option value="EVENTOS">Eventos</option>
                            <option value="PUBLICAÇÕES">Publicações</option>
                            <option value="VÍDEO">Vídeo</option>
                            <option value="ARTIGO" selected>Artigo</option>
                            <option value="__NEW_CATEGORY__">+ Nova Categoria...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="post-cover-file">Imagem ou Vídeo de Capa</label>
                        <input type="file" id="post-cover-file" class="form-control" accept="image/*,video/*">
                        <input type="hidden" id="post-cover">
                        <div id="cover-preview-container" style="margin-top: 15px; display: none; max-width: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1);"></div>
                    </div>

                    <div class="publish-toggle">
                        <label class="switch">
                            <input type="checkbox" id="post-published">
                            <span class="slider"></span>
                        </label>
                        <label for="post-published">Publicar</label>
                        <span id="publish-status" class="status-text">Rascunho — não visível no site</span>
                    </div>

                    <div class="form-group">
                        <label>Conteúdo *</label>
                        <div id="editor-container"></div>
                    </div>

                    <div style="display: flex; gap: 15px; margin-top: 20px;">
                        <button type="button" id="btn-save" class="btn btn-primary">Guardar Publicação</button>
                        <a href="index.html" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="js/api.js?v=24"></script>
    <script src="js/editor.js?v=24"></script>
    <script>
        // Função global para pré-visualização, disponível imediatamente
        window.updateCoverPreview = function(src) {
            const coverPreviewContainer = document.getElementById('cover-preview-container');
            if (!coverPreviewContainer) return;
            
            if (!src) {
                coverPreviewContainer.style.display = 'none';
                return;
            }
            const isVideo = src.startsWith('data:video/') || /\.(mp4|webm|ogg)$/i.test(src);
            if (isVideo) {
                coverPreviewContainer.innerHTML = `<video src="${src}" controls style="width: 100%; max-height: 250px; display: block; object-fit: cover;" muted autoplay loop></video>`;
            } else {
                coverPreviewContainer.innerHTML = `<img src="${src}" alt="Pré-visualização" style="width: 100%; max-height: 250px; display: block; object-fit: cover;">`;
            }
            coverPreviewContainer.style.display = 'block';
        };

        document.addEventListener('DOMContentLoaded', () => {
            const coverFile = document.getElementById('post-cover-file');
            const coverHidden = document.getElementById('post-cover');
            const categorySelect = document.getElementById('post-category');

            // Evento de alteração no ficheiro de capa
            coverFile.addEventListener('change', async function() {
                const file = this.files[0];
                if (file) {
                    try { const url = await API.uploadMedia(file); coverHidden.value = url; window.updateCoverPreview(url); } catch(err) { alert("Erro de upload: " + err.message); }
                }
            });

            // Adicionar novas categorias ao selecionar "+ Nova Categoria..."
            categorySelect.addEventListener('change', function() {
                if (this.value === '__NEW_CATEGORY__') {
                    const newCatName = prompt('Introduza o nome da nova categoria:');
                    if (newCatName && newCatName.trim()) {
                        const cleanName = newCatName.trim().toUpperCase();
                        
                        // Verificar se já existe nas opções
                        let optionExists = false;
                        for (let i = 0; i < categorySelect.options.length; i++) {
                            if (categorySelect.options[i].value === cleanName) {
                                categorySelect.selectedIndex = i;
                                optionExists = true;
                                break;
                            }
                        }
                        
                        if (!optionExists) {
                            const opt = document.createElement('option');
                            opt.value = cleanName;
                            opt.textContent = cleanName.charAt(0) + cleanName.slice(1).toLowerCase();
                            // Insere antes de "+ Nova Categoria..."
                            categorySelect.insertBefore(opt, categorySelect.options[categorySelect.options.length - 1]);
                            categorySelect.value = cleanName;
                        }
                    } else {
                        // Reverter para a opção padrão
                        categorySelect.value = 'ARTIGO';
                    }
                }
            });

            // Verificar capa ao carregar
            const checkCover = setInterval(() => {
                if (coverHidden.value) {
                    window.updateCoverPreview(coverHidden.value);
                    clearInterval(checkCover);
                }
            }, 200);
            setTimeout(() => clearInterval(checkCover), 3000);

            // Estado de publicação
            const publishCheckbox = document.getElementById('post-published');
            const publishStatus = document.getElementById('publish-status');
            
            function updateStatus() {
                if (publishCheckbox.checked) {
                    publishStatus.textContent = 'Publicado — visível no site';
                    publishStatus.className = 'status-text published';
                } else {
                    publishStatus.textContent = 'Rascunho — não visível no site';
                    publishStatus.className = 'status-text';
                }
            }
            
            publishCheckbox.addEventListener('change', updateStatus);
            setTimeout(updateStatus, 500);
        });
    </script>
</body>
</html>
