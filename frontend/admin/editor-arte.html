<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <link rel="preconnect" href="https://ulymellasjmsejgeutyt.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://ulymellasjmsejgeutyt.supabase.co">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Arte - Mário &amp; Joel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/auth.js?v=32"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo">M&amp;J Admin</div>
            <nav class="admin-nav">
                <a href="index.html">Publicações</a>
                <a href="equipa.html">Equipa</a>
                <a href="artes.html" class="active">Arte</a>
                <a href="gestao-expertise.html">Áreas de Prática</a>
                <a href="gestao-sobrenos.html">Sobre Nós</a>
                <a href="gestao-servicos.html">Opções do Formulário</a>
                <a href="../index.html">Ver Site</a>
            
                <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                    <a href="mudar-senha.html">Mudar Senha</a>
                    <a href="#" id="btn-logout">Terminar Sessão</a>
                </div>
            </nav>
        </aside>
        
        <main class="admin-content">
            <div class="admin-header">
                <h1 id="editor-title">Nova Peça de Arte</h1>
                <a href="artes.html" class="btn btn-secondary">Cancelar</a>
            </div>

            <div class="card">
                <form id="arte-form" onsubmit="event.preventDefault();">
                    <input type="hidden" id="arte-id">
                    
                    <div class="form-group">
                        <label for="arte-title">Título da Peça</label>
                        <input type="text" id="arte-title" class="form-control" required placeholder="Ex: Pensador de Cokwe">
                    </div>
                    
                    <div class="form-group">
                        <label for="arte-image-file">Imagem ou Vídeo da Peça</label>
                        <input type="file" id="arte-image-file" class="form-control" accept="image/*,video/*">
                        <input type="hidden" id="arte-image">
                        <div id="arte-preview-container" style="margin-top: 15px; display: none; max-width: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1);"></div>
                    </div>

                    <div class="form-group">
                        <label>Descrição / Detalhes</label>
                        <div id="quill-editor" style="height: 300px; background: white;"></div>
                        <input type="hidden" id="arte-desc">
                    </div>

                    <button type="button" id="btn-save-arte" class="btn btn-primary" style="margin-top: 20px;">Gravar Peça de Arte</button>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="js/api.js?v=32"></script>
    <script>
        // FIX: Inicializar Quill imediatamente (script no fim do body, DOM já está pronto)
        var quill = new Quill('#quill-editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link', 'clean']
                ]
            }
        });

        // Pré-visualização de imagem/vídeo
        var imageFile = document.getElementById('arte-image-file');
        var imageHidden = document.getElementById('arte-image');
        var previewContainer = document.getElementById('arte-preview-container');

        function updateArtePreview(src) {
            if (!src) {
                previewContainer.style.display = 'none';
                return;
            }
            var isVideo = src.startsWith('data:video/') || /\.(mp4|webm|ogg)$/i.test(src);
            if (isVideo) {
                previewContainer.innerHTML = `<video src="${src}" controls style="width: 100%; max-height: 250px; display: block; object-fit: cover;" muted autoplay loop></video>`;
            } else {
                previewContainer.innerHTML = `<img loading="lazy" decoding="async" src="${src}" alt="Pré-visualização" style="width: 100%; max-height: 250px; display: block; object-fit: cover;">`;
            }
            previewContainer.style.display = 'block';
        }

        imageFile.addEventListener('change', async function() {
            var file = this.files[0];
            if (file) {
                try { const url = await API.uploadMedia(file); imageHidden.value = url; updateArtePreview(url); } catch (err) { alert("Erro: " + err.message); }
            }
        });

        // Carregar dados se estiver em modo de edição
        var urlParams = new URLSearchParams(window.location.search);
        var arteId = urlParams.get('id');

        if (arteId) {
            document.getElementById('editor-title').textContent = 'Editar Peça de Arte';
            var arte = await API.getArte(arteId);
            if (arte) {
                document.getElementById('arte-id').value = arte.id;
                document.getElementById('arte-title').value = arte.title;
                document.getElementById('arte-image').value = arte.image || '';
                updateArtePreview(arte.image);
                // FIX: quill já existe aqui — carregar conteúdo existente
                quill.root.innerHTML = arte.description || '';
            
                    }
                }, { once: true });
            }
        }

        document.getElementById('btn-save-arte').addEventListener('click', function() {
            var title = document.getElementById('arte-title').value.trim();
            var image = document.getElementById('arte-image').value;

            // FIX: Ler descrição diretamente do Quill
            var description = quill.root.innerHTML;
            document.getElementById('arte-desc').value = description;

            if (!title) {
                alert('Por favor, preencha o título!');
                return;
            }

            if (!image) {
                alert('Por favor, selecione uma imagem ou vídeo!');
                return;
            }

            var btn = document.getElementById('btn-save-arte');
            btn.textContent = 'A guardar...';
            btn.disabled = true;

            var arteData = {
                id: document.getElementById('arte-id').value || null,
                title: title,
                image: image,
                description: description
            };

            API.saveArte(arteData).then(function() {
                alert('Peça de arte guardada com sucesso!');
                window.location.href = 'artes.html';
            }).catch(function(err) {
                alert('Erro ao guardar arte: ' + err.message);
                btn.textContent = 'Gravar Peça de Arte';
                btn.disabled = false;
            });
        });
    </script>
</body>

</html>
