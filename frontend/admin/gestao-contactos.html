<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Pedidos & Contactos - Mário & Joel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/auth.js?v=29"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo">M&amp;J Admin</div>
            <nav class="admin-nav">
                <a href="index.html">Publicações</a>
                <a href="equipa.html">Equipa</a>
                <a href="artes.html">Arte</a>
                <a href="gestao-expertise.html">Áreas de Prática</a>
                <a href="gestao-sobrenos.html">Sobre Nós</a>
                <a href="gestao-contactos.html" class="active">Contactos &amp; Pedidos</a>
                <a href="../index.html">Ver Site</a>
            
                <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                    <a href="mudar-senha.html">Mudar Senha</a>
                    <a href="#" id="btn-logout">Terminar Sessão</a>
                </div>
            </nav>
        </aside>
        
        <main class="admin-content">
            <div class="admin-header">
                <h1>Pedidos de Contacto, Reuniões &amp; Auditorias</h1>
            </div>

            <div class="card" style="margin-bottom: 40px;">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Nome / Empresa</th>
                            <th>Contacto</th>
                            <th>Tipo de Pedido</th>
                            <th>Mensagem</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="contactos-tbody">
                        <!-- Contactos dynamically loaded here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal para Detalhes do Pedido -->
    <div id="contact-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1000;">
        <div style="background:#fff; width:90%; max-width:600px; padding:30px; border-radius:12px; box-shadow:0 15px 35px rgba(0,0,0,0.2); position:relative;">
            <h2 style="margin-top:0; color:var(--color-primary); font-family:'Cinzel',serif; border-bottom:2px solid #c5a880; padding-bottom:10px;">Detalhes do Pedido</h2>
            <div id="contact-modal-body" style="margin:20px 0;"></div>
            <div style="text-align:right;">
                <button class="btn btn-secondary" onclick="fecharModalContacto()">Fechar</button>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=29"></script>
    <script src="js/contactos.js?v=29"></script>
</body>
</html>
